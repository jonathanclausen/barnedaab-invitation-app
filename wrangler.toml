name = "barnedaab-invitation-app"
main = "server/index.ts"
compatibility_date = "2026-10-01"

# Frontend (vite build) serveres som statiske filer. /api/* går til workeren.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "barnedaab-invitation"
database_id = "f1f8a80d-4d1a-4587-a18d-56119dd5ac26"
migrations_dir = "migrations"
