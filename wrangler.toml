name = "barnedaab-invitation-app"
main = "server/index.ts"
compatibility_date = "2026-10-01"

# Frontend (vite build) serveres som statiske filer via workeren, så den kan
# sende www.<domæne> videre til <domæne>. /api/* håndteres af workeren.
# Det eget domæne tilføjes i Cloudflare-dashboardet (Workers > Domains & Routes),
# så det ikke står i dette offentlige repo.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "barnedaab-invitation"
database_id = "f1f8a80d-4d1a-4587-a18d-56119dd5ac26"
migrations_dir = "migrations"

# Forhåndsvisninger af PR-grene (`wrangler preview`) bruger en separat, tom
# test-database, så de aldrig rører de rigtige gæstedata.
[[previews.d1_databases]]
binding = "DB"
database_id = "a2cee47c-cf5d-486f-aa9e-6dc92feee572"
